extends: capitalization
message: "'%s' should use sentence-style capitalization."
# Copy of Google.Headings with extra exceptions for product names and acronyms used in this portfolio.
link: "https://developers.google.com/style/capitalization#capitalization-in-titles-and-headings"
level: warning
scope: heading
match: $sentence
# No `indicators: [":"]` here. That makes Vale require a capital after a colon,
# which is the Microsoft convention this rule was originally copied from. This
# guide says the opposite: "the first word after a colon is generally
# lowercase" (developers.google.com/style/colons), and Colons.yml enforces
# exactly that. See issue #58.
exceptions:
  - Azure
  - CLI
  - Cosmos
  - Docker
  - Emmet
  - gRPC
  - I
  - Kubernetes
  - Linux
  - macOS
  - Marketplace
  - MongoDB
  - REPL
  - Studio
  - TypeScript
  - URLs
  - Visual
  - VS
  - Windows
  - JSON
  - API
  - APIs
  - cURL
  - DC
  - GeoJSON
  - HPOS
  - HTML
  - HTTP
  - JavaScript
  - JWT
  - NWS
  - PM2
  - REST
  - Slack
  - URL
  - User-Agent
  - WooCommerce
  - WordPress
  - PHP
  - Node.js
  - SQLite
  - Postman
  - Python
  - MkDocs
  - Awaiting Review
  - Orders list
  - Task API
  - Washington, DC
  - (?-i)GET
  - Conflict on
