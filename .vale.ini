# Vale configuration for the portfolio (Google developer documentation style).
# Setup (once):  install Vale (Windows: winget install errata-ai.Vale),
#                then run `vale sync` in this folder to download the Google style.
# Lint:          vale docs
#                vale --minAlertLevel=warning docs   (skip suggestions)

StylesPath = styles
MinAlertLevel = suggestion
Vocab = Portfolio
Packages = Google

[*.md]
BasedOnStyles = Vale, Google, Portfolio
Google.Headings = NO

# Off: too noisy for API reference pages (turn back on for a deep edit).
Google.Acronyms = NO
Google.Parens = NO
# Off: the samples use bold lead-in labels ("**Note:** Text", "**Cause:** The ...").
# Google generally lowercases after a colon; these labels follow the note-label
# convention instead. Turn on to review them.
Google.Colons = NO

# Case study pages describe my own process, so first person is intended.
[{docs/*/index.md}]
BasedOnStyles = Vale, Google, Portfolio
Google.Headings = NO
Google.Acronyms = NO
Google.Parens = NO
Google.Colons = NO
Google.FirstPerson = NO
Google.We = NO

# Style guide draft under review at The Good Docs Project; it quotes
# examples of what not to write, so it is linted separately.
[docs/vr-style-guide/*.md]
BasedOnStyles = Vale
